<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة سير العمل والمراسلات - BA Engineering Academy</title>
    <!-- مكتبة التصميم Tailwind CSS لتنسيق السهولة والسرعة -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- شريط العناوين -->
    <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">لوحة تحكم المراسلات والاعتمادات الهندسية</h1>
        <span class="text-sm bg-blue-800 px-3 py-1 rounded-full">BA-Workflow</span>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
        
        <!-- قسم جدول الخطابات -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-lg font-bold mb-4 text-blue-900 border-b pb-2">الخطابات الرسمية (Correspondence)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3">رقم المرجع</th>
                            <th class="p-3">الموضوع</th>
                            <th class="p-3">المرسل / المستلم</th>
                            <th class="p-3">النوع</th>
                            <th class="p-3">الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="correspondenceTable" class="divide-y divide-gray-100 text-sm">
                        <tr><td colspan="5" class="p-4 text-center text-gray-400">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- قسم جدول الاعتمادات الهندسية -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-lg font-bold mb-4 text-blue-900 border-b pb-2">الاعتمادات الهندسية ومتابعة الـ Workflows</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3">نوع المستند</th>
                            <th class="p-3">كود المستند</th>
                            <th class="p-3">العنوان</th>
                            <th class="p-3">مقدم بواسطة</th>
                            <th class="p-3">حالة المراجعة</th>
                        </tr>
                    </thead>
                    <tbody id="workflowsTable" class="divide-y divide-gray-100 text-sm">
                        <tr><td colspan="5" class="p-4 text-center text-gray-400">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- كود الاتصال وجلب البيانات -->
    <script>
        // استبدل القيم دي ببيانات مشروعك الفعلية من Supabase (Project Settings -> API)
        const SUPABASE_URL = 'حط_رابط_المشروع_هنا';
        const SUPABASE_ANON_KEY = 'حط_مفتاح_الـ_anon_هنا';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // جلب وعرض بيانات الخطابات
        async function fetchCorrespondenceData() {
            const tbody = document.getElementById('correspondenceTable');
            const { data, error } = await _supabase.from('correspondence').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">خطأ في جلب البيانات: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">لا توجد خطابات مسجلة حالياً.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 font-semibold">${item.reference_no}</td>
                    <td class="p-3">${item.subject}</td>
                    <td class="p-3">${item.sender_recipient}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs ${item.type === 'incoming' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">${item.type}</span></td>
                    <td class="p-3"><span class="px-2 py-1 bg-blue-50 text-blue-700 rounded text-xs">${item.status}</span></td>
                </tr>
            `).join('');
        }

        // جلب وعرض بيانات الاعتمادات الهندسية
        async function fetchWorkflowsData() {
            const tbody = document.getElementById('workflowsTable');
            const { data, error } = await _supabase.from('engineering_workflows').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">خطأ في جلب البيانات: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">لا توجد اعتمادات مسجلة حالياً.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 font-medium text-blue-800">${item.module_type}</td>
                    <td class="p-3 font-semibold">${item.document_code}</td>
                    <td class="p-3">${item.title}</td>
                    <td class="p-3">${item.submitted_by}</td>
                    <td class="p-3"><span class="px-2 py-1 bg-purple-50 text-purple-700 rounded text-xs">${item.review_status}</span></td>
                </tr>
            `).join('');
        }

        // تشغيل الدوال عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            fetchCorrespondenceData();
            fetchWorkflowsData();
        });
    </script>
</body>
</html>
