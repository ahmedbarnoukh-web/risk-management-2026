<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BA Engineering Academy</title>
    <link rel="icon" href="https://www.barnoukh-engineering.com/photo/logo.jpg">
    <meta name="theme-color" content="#0F2C52">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .status-badge { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:12px; font-weight:600; }
        .needs-action { background-color:#FFFBEB !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header style="background-color:#0F2C52" class="text-white p-4 flex flex-wrap justify-between items-center shadow-md gap-2">
        <div class="flex items-center gap-3">
            <img src="https://www.barnoukh-engineering.com/photo/logo.jpg" alt="logo" class="h-10 w-10 rounded object-cover">
            <h1 class="font-bold text-sm md:text-base">BA Engineering Academy — بوابة المراسلات</h1>
        </div>
        <div id="userBar" class="hidden items-center gap-2 text-sm flex-wrap">
            <select id="identitySelect" class="text-gray-800 rounded p-1 text-xs">
                <option value="السكرتيرة">أنا: السكرتيرة</option>
                <option value="موظف 1">أنا: موظف 1</option>
                <option value="موظف 2">أنا: موظف 2</option>
                <option value="موظف 3">أنا: موظف 3</option>
                <option value="موظف 4">أنا: موظف 4</option>
                <option value="موظف 5">أنا: موظف 5</option>
            </select>
            <span id="adminBadge" class="hidden text-xs bg-green-500 px-2 py-1 rounded">صلاحيات المدير مفعّلة</span>
            <button id="adminBtn" class="bg-white/20 px-3 py-1 rounded hover:bg-white/30 text-xs">صلاحيات المدير</button>
            <button id="logoutBtn" class="bg-red-600 px-3 py-1 rounded text-xs">خروج</button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-6xl">

        <!-- ============ شاشة الدخول ============ -->
        <div id="loginBox" class="bg-white p-6 rounded-lg shadow max-w-sm mx-auto mt-10">
            <h2 id="loginTitle" class="font-bold text-lg mb-4">تسجيل دخول الشركة</h2>
            <form id="loginForm" class="space-y-3">
                <input type="email" id="loginEmail" required placeholder="البريد الإلكتروني للشركة" class="w-full border p-2 rounded">
                <input type="password" id="loginPass" required placeholder="كلمة المرور" class="w-full border p-2 rounded">
                <button style="background-color:#0F2C52" class="w-full text-white p-2 rounded">دخول</button>
            </form>
            <button id="switchModeBtn" class="text-blue-600 text-sm mt-3">ليس لديك حساب؟ أنشئ حساب جديد للشركة</button>
        </div>

        <!-- ============ الصفحة الرئيسية ============ -->
        <div id="appBox" class="hidden">

            <!-- تنبيه للموظف: عنده حاجة تحتاج إجراء -->
            <div id="actionAlert" class="hidden bg-yellow-100 border border-yellow-400 text-yellow-800 p-3 rounded-lg mb-4 text-sm">
                🔔 عندك <span id="actionCount">0</span> مستند محوّل لك محتاج ردك.
            </div>

            <!-- فورم إضافة / تعديل (خاص بالسكرتيرة أو المدير) -->
            <div id="addFormBox" class="bg-white p-6 rounded-lg shadow mb-6">
                <h3 id="formTitle" class="font-bold mb-4">إضافة مستند جديد</h3>
                <form id="addForm" class="grid grid-cols-2 gap-3">
                    <input type="hidden" id="editId" value="">
                    <input type="text" id="fProject" required placeholder="اسم المشروع" class="border p-2 rounded col-span-2">
                    <input type="text" id="fRef" required placeholder="رقم المرجع" class="border p-2 rounded col-span-1">
                    <input type="text" id="fRecipient" required placeholder="المرسل / الموجه اليه" class="border p-2 rounded col-span-1">
                    <input type="text" id="fSubject" required placeholder="الموضوع" class="border p-2 rounded col-span-2">

                    <select id="fType" class="border p-2 rounded col-span-1">
                        <option value="خطاب">خطاب</option>
                        <option value="مادة">مادة</option>
                        <option value="مخطط">مخطط</option>
                        <option value="RFI">RFI</option>
                        <option value="مستخلص">مستخلص</option>
                        <option value="محضر استلام نهائي">محضر استلام نهائي</option>
                        <option value="محضر استلام ابتدائي">محضر استلام ابتدائي</option>
                    </select>
                    <select id="fDirection" class="border p-2 rounded col-span-1">
                        <option value="صادر">صادر</option>
                        <option value="وارد">وارد</option>
                    </select>

                    <select id="fPriority" class="border p-2 rounded col-span-1">
                        <option value="عادي">عادي</option>
                        <option value="عاجل">عاجل</option>
                    </select>
                    <input type="date" id="fDate" required class="border p-2 rounded col-span-1">

                    <div class="col-span-2 flex gap-2">
                        <button id="submitBtn" style="background-color:#0F2C52" class="flex-1 text-white p-2 rounded">حفظ</button>
                        <button type="button" id="cancelEditBtn" class="hidden bg-gray-400 text-white p-2 rounded px-4">إلغاء</button>
                    </div>
                </form>
            </div>

            <!-- الجدول + الفلتر -->
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="flex flex-wrap justify-between items-center mb-4 gap-3">
                    <h3 class="font-bold">سجل المراسلات</h3>
                    <div id="statusFilters" class="flex flex-wrap gap-2 text-xs">
                        <button data-filter="all" class="filter-btn active border px-3 py-1 rounded-full">الكل</button>
                        <button data-filter="جديد" class="filter-btn border px-3 py-1 rounded-full">جديد</button>
                        <button data-filter="قيد التنفيذ" class="filter-btn border px-3 py-1 rounded-full">قيد التنفيذ</button>
                        <button data-filter="بانتظار مراجعة المدير" class="filter-btn border px-3 py-1 rounded-full">بانتظار المراجعة</button>
                        <button data-filter="معتمد" class="filter-btn border px-3 py-1 rounded-full">معتمد</button>
                        <button data-filter="مرفوض" class="filter-btn border px-3 py-1 rounded-full">مرفوض</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-right">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="p-2">المشروع</th>
                                <th class="p-2">الرقم</th>
                                <th class="p-2">الموضوع</th>
                                <th class="p-2">النوع</th>
                                <th class="p-2">محوّل لـ</th>
                                <th class="p-2">الحالة</th>
                                <th class="p-2">إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="7" class="p-4 text-center">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ============================================================
        // ✏️ تقدر تغيّر الرقم السري وأسامي الموظفين هنا بسهولة
        const ADMIN_PIN = '2026';
        const EMPLOYEES = ['موظف 1', 'موظف 2', 'موظف 3', 'موظف 4', 'موظف 5'];
        // ============================================================

        const db = supabase.createClient(
            'https://rzhyuufqhuejamcpbzst.supabase.co',
            'sb_publishable_sUFjo5uXyaL0MJbRrDIiFg_ixhooI4p'
        );

        let signUpMode = false;
        let allRows = [];
        let activeFilter = 'all';
        let isAdmin = false;
        let currentIdentity = 'السكرتيرة';

        const loginBox = document.getElementById('loginBox');
        const appBox = document.getElementById('appBox');
        const userBar = document.getElementById('userBar');

        document.getElementById('fDate').value = new Date().toISOString().split('T')[0];

        // ============ تبديل دخول / تسجيل ============
        document.getElementById('switchModeBtn').onclick = () => {
            signUpMode = !signUpMode;
            document.getElementById('loginTitle').textContent = signUpMode ? 'إنشاء حساب جديد للشركة' : 'تسجيل دخول الشركة';
            document.getElementById('switchModeBtn').textContent = signUpMode ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ أنشئ حساب جديد للشركة';
        };

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;

            const result = signUpMode
                ? await db.auth.signUp({ email, password })
                : await db.auth.signInWithPassword({ email, password });

            if (result.error) {
                alert('خطأ: ' + result.error.message);
            } else if (signUpMode) {
                alert('تم إنشاء الحساب بنجاح! سجل دخولك دلوقتي.');
                document.getElementById('switchModeBtn').click();
            }
        };

        document.getElementById('logoutBtn').onclick = () => { isAdmin = false; db.auth.signOut(); };

        // ============ اختيار الهوية (سكرتيرة / موظف 1-5) ============
        document.getElementById('identitySelect').onchange = (e) => {
            currentIdentity = e.target.value;
            // لو اخترت هوية موظف، نلغي صلاحيات المدير تلقائيًا عشان محدش يتلخبط
            if (currentIdentity !== 'السكرتيرة') {
                isAdmin = false;
                document.getElementById('adminBadge').classList.add('hidden');
            }
            document.getElementById('addFormBox').classList.toggle('hidden', currentIdentity !== 'السكرتيرة' && !isAdmin);
            renderTable();
        };

        // ============ زرار صلاحيات المدير ============
        document.getElementById('adminBtn').onclick = () => {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('adminBadge').classList.add('hidden');
                alert('تم إلغاء صلاحيات المدير.');
            } else {
                const code = prompt('ادخل الرقم السري لصلاحيات المدير:');
                if (code === ADMIN_PIN) {
                    isAdmin = true;
                    document.getElementById('adminBadge').classList.remove('hidden');
                } else if (code !== null) {
                    alert('رقم سري غلط.');
                }
            }
            document.getElementById('addFormBox').classList.toggle('hidden', currentIdentity !== 'السكرتيرة' && !isAdmin);
            renderTable();
        };

        // ============ مراقبة حالة الدخول ============
        db.auth.onAuthStateChange((event, session) => {
            if (session) {
                loginBox.classList.add('hidden');
                appBox.classList.remove('hidden');
                userBar.classList.remove('hidden');
                userBar.classList.add('flex');
                loadTable();
            } else {
                isAdmin = false;
                loginBox.classList.remove('hidden');
                appBox.classList.add('hidden');
                userBar.classList.add('hidden');
                userBar.classList.remove('flex');
            }
        });

        // ============ فلتر الحالة ============
        document.getElementById('statusFilters').addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            activeFilter = btn.dataset.filter;
            document.querySelectorAll('.filter-btn').forEach(b => { b.style.backgroundColor = ''; b.style.color = ''; });
            btn.style.backgroundColor = '#0F2C52';
            btn.style.color = '#fff';
            renderTable();
        });

        function statusBadgeClass(status) {
            switch (status) {
                case 'معتمد': return 'bg-green-100 text-green-800';
                case 'مرفوض': return 'bg-red-100 text-red-800';
                case 'قيد التنفيذ': return 'bg-yellow-100 text-yellow-800';
                case 'بانتظار مراجعة المدير': return 'bg-purple-100 text-purple-800';
                default: return 'bg-blue-100 text-blue-800';
            }
        }

        // ============ جلب المستندات ============
        async function loadTable() {
            const { data, error } = await db.from('correspondence').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tableBody');
            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-500">${error.message}</td></tr>`;
                return;
            }
            allRows = data || [];
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            let rows = activeFilter === 'all' ? allRows : allRows.filter(r => (r.status || 'جديد') === activeFilter);

            // تنبيه الموظف بعدد المستندات المحتاجة رد منه
            const needsAction = allRows.filter(r => r.assigned_to === currentIdentity && r.status === 'قيد التنفيذ');
            const alertBox = document.getElementById('actionAlert');
            if (EMPLOYEES.includes(currentIdentity) && needsAction.length > 0) {
                alertBox.classList.remove('hidden');
                document.getElementById('actionCount').textContent = needsAction.length;
            } else {
                alertBox.classList.add('hidden');
            }

            if (!rows.length) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">مفيش مستندات مطابقة</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map(row => {
                const highlight = (row.assigned_to === currentIdentity && row.status === 'قيد التنفيذ') ? 'needs-action' : '';
                return `
                <tr class="border-b hover:bg-gray-50 align-top ${highlight}">
                    <td class="p-2">${row.project_name || '-'}</td>
                    <td class="p-2">${row.reference_no || '-'}</td>
                    <td class="p-2">
                        ${row.subject || '-'}
                        ${row.reply_text ? `<div class="text-xs text-gray-500 mt-1">💬 ${row.reply_text}</div>` : ''}
                    </td>
                    <td class="p-2">${row.type || '-'}</td>
                    <td class="p-2">${row.assigned_to || '-'}</td>
                    <td class="p-2"><span class="status-badge ${statusBadgeClass(row.status)}">${row.status || 'جديد'}</span></td>
                    <td class="p-2 whitespace-nowrap">${actionCell(row)}</td>
                </tr>
            `}).join('');
        }

        // ============ محتوى خلية الإجراء حسب الهوية والصلاحية ============
        function actionCell(row) {
            const status = row.status || 'جديد';

            // === المدير (بعد إدخال الرقم السري) ===
            if (isAdmin) {
                if (status === 'جديد') {
                    const options = EMPLOYEES.map(name => `<option value="${name}">${name}</option>`).join('');
                    return `
                        <div class="flex flex-col gap-1">
                            <select id="assign-${row.id}" class="border rounded text-xs p-1">${options}</select>
                            <button onclick="assignToEmployee('${row.id}')" class="bg-blue-600 text-white text-xs px-2 py-1 rounded">تحويل</button>
                        </div>
                    `;
                }
                if (status === 'بانتظار مراجعة المدير') {
                    return `
                        <div class="flex gap-1 flex-wrap">
                            <button onclick="changeStatus('${row.id}', 'معتمد')" class="bg-green-600 text-white text-xs px-2 py-1 rounded">اعتماد</button>
                            <button onclick="changeStatus('${row.id}', 'مرفوض')" class="bg-red-600 text-white text-xs px-2 py-1 rounded">رفض</button>
                        </div>
                    `;
                }
                return `<button onclick="deleteRow('${row.id}')" class="bg-gray-700 text-white text-xs px-2 py-1 rounded">حذف</button>`;
            }

            // === الموظف صاحب الخطاب المحوّل له ===
            if (EMPLOYEES.includes(currentIdentity) && row.assigned_to === currentIdentity && status === 'قيد التنفيذ') {
                return `
                    <div class="flex flex-col gap-1">
                        <textarea id="reply-${row.id}" rows="2" placeholder="اكتب ردك هنا..." class="border rounded text-xs p-1"></textarea>
                        <button onclick="sendReply('${row.id}')" class="bg-blue-600 text-white text-xs px-2 py-1 rounded">الرد وتحويل للمدير</button>
                    </div>
                `;
            }

            return `<span class="text-gray-400 text-xs">-</span>`;
        }

        // ============ المدير: تحويل لموظف ============
        async function assignToEmployee(id) {
            const select = document.getElementById('assign-' + id);
            const employeeName = select.value;
            const { error } = await db.from('correspondence').update({
                assigned_to: employeeName, status: 'قيد التنفيذ'
            }).eq('id', id);
            if (error) alert('خطأ: ' + error.message);
            else loadTable();
        }

        // ============ الموظف: إرسال الرد ============
        async function sendReply(id) {
            const textarea = document.getElementById('reply-' + id);
            const replyText = textarea.value.trim();
            if (!replyText) { alert('اكتب ردك الأول'); return; }
            const { error } = await db.from('correspondence').update({
                reply_text: replyText, status: 'بانتظار مراجعة المدير'
            }).eq('id', id);
            if (error) alert('خطأ: ' + error.message);
            else loadTable();
        }

        async function changeStatus(id, newStatus) {
            if (!confirm('متأكد؟')) return;
            const { error } = await db.from('correspondence').update({ status: newStatus }).eq('id', id);
            if (error) alert('خطأ: ' + error.message);
            else loadTable();
        }

        async function deleteRow(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المستند نهائيًا؟')) return;
            const { error } = await db.from('correspondence').delete().eq('id', id);
            if (error) alert('خطأ: ' + error.message);
            else loadTable();
        }

        function resetForm() {
            document.getElementById('addForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('formTitle').textContent = 'إضافة مستند جديد';
            document.getElementById('submitBtn').textContent = 'حفظ';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }
        document.getElementById('cancelEditBtn').onclick = resetForm;

        // ============ إضافة مستند جديد (السكرتيرة أو المدير) ============
        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const { data: { session } } = await db.auth.getSession();

            const rowData = {
                project_name: document.getElementById('fProject').value,
                reference_no: document.getElementById('fRef').value,
                sender_recipient: document.getElementById('fRecipient').value,
                subject: document.getElementById('fSubject').value,
                type: document.getElementById('fType').value,
                direction: document.getElementById('fDirection').value,
                priority: document.getElementById('fPriority').value,
                correspondence_date: document.getElementById('fDate').value,
                status: 'جديد',
                user_id: session.user.id
            };

            const { error } = await db.from('correspondence').insert([rowData]);
            if (error) {
                alert('حدث خطأ: ' + error.message);
            } else {
                resetForm();
                loadTable();
            }
        };
    </script>
</body>
</html>
