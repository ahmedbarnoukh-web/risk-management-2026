<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المراسلات الآمنة - BA Engineering Academy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">BA Engineering Academy</h1>
            <div id="auth-nav" class="hidden flex items-center gap-4 text-sm">
                <span id="user-email" class="text-blue-200"></span>
                <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-white">تسجيل خروج</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 max-w-5xl">

        <!-- Section 1: Auth Box (Login / Signup) -->
        <section id="auth-section" class="bg-white rounded-lg shadow-md p-6 max-w-md mx-auto my-12">
            <h2 id="auth-title" class="text-xl font-bold text-blue-900 mb-4 text-center">تسجيل دخول الشركة</h2>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني للشركة</label>
                    <input type="email" id="auth-email" required class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="company@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="auth-password" required class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-900 text-white py-2 rounded text-sm font-medium hover:bg-blue-800 transition">دخول</button>
            </form>
            <div class="mt-4 text-center text-sm">
                <button type="button" id="toggle-auth-mode" class="text-blue-600 hover:underline">ليس لديك حساب؟ أنشئ حساب جديد للشركة</button>
            </div>
        </section>

        <!-- Section 2: Dashboard -->
        <div id="dashboard-section" class="hidden space-y-8">
            <div class="mb-4">
                <h2 class="text-2xl font-bold text-gray-900 mb-1">لوحة مراسلات الشركة</h2>
                <p class="text-gray-600 text-sm">إدارة وعرض خطابات ومراسلات شركتك الخاصة بشكل آمن ومعزول.</p>
            </div>

            <!-- Add Correspondence Form -->
            <section class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-blue-900 mb-4 border-b pb-2">إضافة خطاب جديد</h3>
                <form id="correspondence-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">رقم الخطاب / المرجع</label>
                        <input type="text" id="ref-num" required class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="REF-2026-01">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">المرسل / الموجه اليه</label>
                        <input type="text" id="recipient" required class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="الاستشاري العام">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">موضوع الخطاب</label>
                        <input type="text" id="subject" required class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="اعتماد المخططات">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">الحالة</label>
                        <select id="status" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="جديد">جديد</option>
                            <option value="قيد المراجعة">قيد المراجعة</option>
                            <option value="معتمد">معتمد</option>
                            <option value="مرفوض">مرفوض</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">نوع الخطاب</label>
                        <select id="type" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="صادر">صادر</option>
                            <option value="وارد">وارد</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">الأولوية</label>
                        <select id="priority" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="عادي">عادي</option>
                            <option value="عاجل">عاجل</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">تاريخ المراسلة</label>
                        <input type="date" id="correspondence-date" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="md:col-span-2 flex justify-end">
                        <button type="submit" id="submit-btn" class="bg-blue-900 text-white px-6 py-2 rounded text-sm font-medium hover:bg-blue-800 transition">حفظ وإضافة الخطاب</button>
                    </div>
                </form>
            </section>

            <!-- Correspondence Table -->
            <section class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-blue-900 mb-4 border-b pb-2">سجل مراسلات الشركة</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 text-sm">
                                <th class="p-3 border-b">رقم الخطاب</th>
                                <th class="p-3 border-b">الموضوع</th>
                                <th class="p-3 border-b">المرسل / الموجه اليه</th>
                                <th class="p-3 border-b">النوع</th>
                                <th class="p-3 border-b">الأولوية</th>
                                <th class="p-3 border-b">الحالة</th>
                                <th class="p-3 border-b">التاريخ</th>
                                <th class="p-3 border-b">الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="correspondence-tbody" class="text-sm divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="p-4 text-center text-gray-500">جاري التحميل...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Supabase Auth & App Logic Script -->
    <script>
        const SUPABASE_URL = 'https://rzhyuufqhuejamcpbzst.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sUFjo5uXyaL0MJbRrDIiFg_ixhooI4p';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUpMode = false;

        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const authNav = document.getElementById('auth-nav');
        const userEmailSpan = document.getElementById('user-email');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');

        // تبديل بين وضع تسجيل الدخول أو إنشاء حساب
        toggleAuthModeBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                authTitle.textContent = 'إنشاء حساب جديد للشركة';
                authSubmitBtn.textContent = 'تسجيل حساب';
                toggleAuthModeBtn.textContent = 'لديك حساب بالفعل؟ سجل دخولك';
            } else {
                authTitle.textContent = 'تسجيل دخول الشركة';
                authSubmitBtn.textContent = 'دخول';
                toggleAuthModeBtn.textContent = 'ليس لديك حساب؟ أنشئ حساب جديد للشركة';
            }
        });

        // التحقق من حالة المستخدم الحالي عند فتح الصفحة
        async function checkUserSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            manageSessionUI(session);

            _supabase.auth.onAuthStateChange((event, session) => {
                manageSessionUI(session);
            });
        }

        function manageSessionUI(session) {
            if (session) {
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                authNav.classList.remove('hidden');
                userEmailSpan.textContent = session.user.email;
                fetchCorrespondenceData();
            } else {
                authSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
                authNav.classList.add('hidden');
            }
        }

        // معالجة نموذج الدخول أو التسجيل
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            authSubmitBtn.disabled = true;

            if (isSignUpMode) {
                const { data, error } = await _supabase.auth.signUp({ email, password });
                if (error) {
                    alert('خطأ في التسجيل: ' + error.message);
                } else {
                    alert('تم إنشاء الحساب بنجاح! يرجى تسجيل الدخول الآن.');
                    isSignUpMode = false;
                    authTitle.textContent = 'تسجيل دخول الشركة';
                    authSubmitBtn.textContent = 'دخول';
                    toggleAuthModeBtn.textContent = 'ليس لديك حساب؟ أنشئ حساب جديد للشركة';
                }
            } else {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('خطأ في بيانات الدخول: ' + error.message);
                }
            }
            authSubmitBtn.disabled = false;
        });

        // تسجيل الخروج
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await _supabase.auth.signOut();
        });

        // خريطة ألوان لكل حالة
        function statusBadgeClass(status) {
            switch (status) {
                case 'معتمد': return 'bg-green-100 text-green-800';
                case 'مرفوض': return 'bg-red-100 text-red-800';
                case 'قيد المراجعة': return 'bg-yellow-100 text-yellow-800';
                default: return 'bg-blue-100 text-blue-800'; // جديد
            }
        }

        // جلب البيانات الخاصة بالشركة الحالية فقط
        async function fetchCorrespondenceData() {
            const tbody = document.getElementById('correspondence-tbody');
            const { data, error } = await _supabase.from('correspondence').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">خطأ في جلب البيانات: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-500">لا توجد خطابات مسجلة لشركتك حتى الآن.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => {
                // أزرار الاعتماد/الرفض تظهر فقط لو الحالة لسه "جديد" أو "قيد المراجعة"
                const showActions = item.status !== 'معتمد' && item.status !== 'مرفوض';
                const actionsHtml = showActions ? `
                    <div class="flex gap-2 justify-end">
                        <button onclick="updateStatus('${item.id}', 'معتمد')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1 rounded transition">اعتماد</button>
                        <button onclick="updateStatus('${item.id}', 'مرفوض')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1 rounded transition">رفض</button>
                    </div>
                ` : `<span class="text-gray-400 text-xs">تم البت</span>`;

                return `
                <tr class="hover:bg-gray-50">
                    <td class="p-3">${item.reference_no || '-'}</td>
                    <td class="p-3">${item.subject || '-'}</td>
                    <td class="p-3">${item.recipient || '-'}</td>
                    <td class="p-3">${item.type || '-'}</td>
                    <td class="p-3">${item.priority === 'عاجل' ? '<span class="text-red-600 font-semibold">عاجل</span>' : (item.priority || '-')}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs ${statusBadgeClass(item.status)}">${item.status || 'جديد'}</span></td>
                    <td class="p-3 text-gray-500">${item.created_at ? new Date(item.created_at).toLocaleDateString('ar-SA') : '-'}</td>
                    <td class="p-3">${actionsHtml}</td>
                </tr>
            `;
            }).join('');
        }

        // تحديث حالة خطاب معين (اعتماد أو رفض)
        async function updateStatus(id, newStatus) {
            const confirmMsg = newStatus === 'معتمد' ? 'هل أنت متأكد من اعتماد هذا الخطاب؟' : 'هل أنت متأكد من رفض هذا الخطاب؟';
            if (!confirm(confirmMsg)) return;

            const { error } = await _supabase.from('correspondence').update({ status: newStatus }).eq('id', id);

            if (error) {
                alert('حدث خطأ أثناء تحديث الحالة: ' + error.message);
            } else {
                fetchCorrespondenceData();
            }
        }

        // إضافة خطاب جديد وربطه تلقائياً بالمستخدم الحالي
        document.getElementById('correspondence-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الحفظ...';

            const { data: { session } } = await _supabase.auth.getSession();

            const newRecord = {
                reference_no: document.getElementById('ref-num').value,
                subject: document.getElementById('subject').value,
                recipient: document.getElementById('recipient').value,
                status: document.getElementById('status').value,
                type: document.getElementById('type').value,
                priority: document.getElementById('priority').value,
                correspondence_date: document.getElementById('correspondence-date').value || null,
                user_id: session.user.id
            };

            const { error } = await _supabase.from('correspondence').insert([newRecord]);

            if (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } else {
                document.getElementById('correspondence-form').reset();
                fetchCorrespondenceData();
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'حفظ وإضافة الخطاب';
        });

        // تشغيل التحقق من الجلسة عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            checkUserSession();
        });
    </script>
</body>
</html>
