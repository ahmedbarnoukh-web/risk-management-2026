<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BA Engineering — Correspondence Portal</title>
    <link rel="icon" href="https://www.barnoukh-engineering.com/photo/logo.jpg">
    <meta name="theme-color" content="#0F2C52">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #F7F8FA;
            --surface: #FFFFFF;
            --border: #E4E7EC;
            --text-primary: #101828;
            --text-secondary: #667085;
            --brand: #0F2C52;
            --brand-light: #2E5AAC;
        }
        * { font-family: 'Inter', -apple-system, sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        body { background: var(--bg); color: var(--text-primary); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
        .btn-primary { background: var(--brand); color: #fff; transition: background .15s; }
        .btn-primary:hover { background: var(--brand-light); }
        .seg-btn { color: var(--text-secondary); border-bottom: 2px solid transparent; }
        .seg-btn.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
        .status-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:9999px; font-size:12px; font-weight:600; white-space:nowrap; }
        .row-flag { box-shadow: inset 3px 0 0 #F79009; }
        input:focus, select:focus, textarea:focus { outline:none; box-shadow: 0 0 0 3px rgba(46,90,172,0.15); border-color: var(--brand-light); }
        .modal-overlay { background: rgba(16,24,40,0.5); backdrop-filter: blur(2px); }
        table th { color: var(--text-secondary); font-weight:600; font-size:12px; text-transform:none; }
        tbody tr:hover { background: #FBFCFD; }
    </style>
</head>
<body>

    <!-- ============ TOP BAR ============ -->
    <header class="bg-white border-b" style="border-color:var(--border)">
        <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 shrink-0">
                <img src="https://www.barnoukh-engineering.com/photo/logo.jpg" class="h-8 w-8 rounded object-cover" alt="logo">
                <span class="font-semibold text-sm hidden sm:inline">BA Engineering</span>
            </div>
            <div id="userBar" class="hidden items-center gap-3 text-sm">
                <input id="searchInput" type="text" placeholder="Search reference, subject, project..."
                    class="hidden md:block border rounded-lg px-3 py-1.5 text-sm w-72" style="border-color:var(--border)">
                <span id="userRoleBadge" class="text-xs font-medium px-2.5 py-1 rounded-full" style="background:#EFF4FF;color:var(--brand-light)"></span>
                <span id="userNameBadge" class="hidden md:inline" style="color:var(--text-secondary)"></span>
                <button id="logoutBtn" class="text-sm font-medium px-3 py-1.5 rounded-lg border hover:bg-gray-50" style="border-color:var(--border)">Log out</button>
            </div>
        </div>
    </header>

    <!-- ============ LOGIN ============ -->
    <div id="loginBox" class="card p-8 max-w-sm mx-auto mt-16">
        <div class="flex gap-1 mb-6 p-1 rounded-lg" style="background:#F1F5F9">
            <button id="tabLogin" class="flex-1 text-sm font-medium py-2 rounded-md" style="background:#fff;color:var(--brand)">Log in</button>
            <button id="tabSignup" class="flex-1 text-sm font-medium py-2 rounded-md" style="color:var(--text-secondary)">Sign up</button>
        </div>
        <h2 id="loginTitle" class="font-semibold text-lg mb-1">Welcome back</h2>
        <p id="loginSubtitle" class="text-sm mb-5" style="color:var(--text-secondary)">Log in with your existing account</p>
        <form id="loginForm" class="space-y-3">
            <input type="text" id="companyCode" required placeholder="Company code" class="w-full border rounded-lg p-2.5 text-sm" style="border-color:var(--border)">
            <input type="text" id="fullName" placeholder="Full name" class="hidden w-full border rounded-lg p-2.5 text-sm" style="border-color:var(--border)">
            <select id="roleSelect" class="hidden w-full border rounded-lg p-2.5 text-sm" style="border-color:var(--border)">
                <option value="Manager">Manager</option>
                <option value="Employee">Employee</option>
            </select>
            <input type="email" id="loginEmail" required placeholder="Email" class="w-full border rounded-lg p-2.5 text-sm" style="border-color:var(--border)">
            <input type="password" id="loginPass" required placeholder="Password" class="w-full border rounded-lg p-2.5 text-sm" style="border-color:var(--border)">
            <button id="loginSubmitBtn" class="btn-primary w-full rounded-lg p-2.5 text-sm font-medium">Log in</button>
        </form>
        <div class="mt-5 pt-4 border-t" style="border-color:var(--border)">
            <p class="text-xs mb-2 text-center" style="color:var(--text-secondary)">Quick access while testing</p>
            <div class="flex gap-2">
                <button id="quickManagerBtn" type="button" class="flex-1 text-xs font-medium py-2 rounded-lg border" style="border-color:var(--border)">Quick Manager Login</button>
                <button id="quickEmployeeBtn" type="button" class="flex-1 text-xs font-medium py-2 rounded-lg border" style="border-color:var(--border)">Quick Employee Login</button>
            </div>
        </div>
    </div>

    <!-- ============ MAIN APP ============ -->
    <main id="appBox" class="hidden max-w-7xl mx-auto px-5 py-6">

        <div id="actionAlert" class="hidden mb-5 p-3.5 rounded-lg text-sm flex items-center gap-2" style="background:#FFFAEB;color:#B54708;border:1px solid #FEDF89">
            <span>●</span> You have <b id="actionCount">0</b> document(s) awaiting your reply.
        </div>

        <!-- Page header -->
        <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
            <div>
                <h1 class="text-xl font-semibold">Correspondence</h1>
                <p class="text-sm" style="color:var(--text-secondary)">Track, transfer, and approve project documents</p>
            </div>
            <button id="openAddModal" class="btn-primary rounded-lg px-4 py-2 text-sm font-medium">+ New Document</button>
        </div>

        <!-- Stats -->
        <div id="statsRow" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"></div>

        <!-- Filters -->
        <div class="card p-1 mb-4 inline-flex flex-wrap gap-1" id="statusFiltersWrap">
            <button data-filter="all" class="filter-btn seg-btn active px-3 py-2 text-sm">All</button>
            <button data-filter="New" class="filter-btn seg-btn px-3 py-2 text-sm">New</button>
            <button data-filter="In Progress" class="filter-btn seg-btn px-3 py-2 text-sm">In Progress</button>
            <button data-filter="Pending Manager Review" class="filter-btn seg-btn px-3 py-2 text-sm">Pending Review</button>
            <button data-filter="Approved" class="filter-btn seg-btn px-3 py-2 text-sm">Approved</button>
            <button data-filter="Rejected" class="filter-btn seg-btn px-3 py-2 text-sm">Rejected</button>
        </div>
        <input id="searchInputMobile" type="text" placeholder="Search..." class="md:hidden w-full border rounded-lg p-2.5 text-sm mb-4" style="border-color:var(--border)">

        <!-- Table -->
        <div class="card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b" style="border-color:var(--border)">
                            <th class="p-3">Project</th>
                            <th class="p-3">Reference</th>
                            <th class="p-3">Subject</th>
                            <th class="p-3">Type</th>
                            <th class="p-3">File</th>
                            <th class="p-3">Assigned to</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" class="p-6 text-center" style="color:var(--text-secondary)">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ============ ADD/EDIT MODAL ============ -->
    <div id="addModal" class="hidden fixed inset-0 modal-overlay z-40 flex items-center justify-center p-4">
        <div class="card w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="formTitle" class="font-semibold text-lg">New Document</h3>
                <button id="closeModalBtn" class="text-2xl leading-none" style="color:var(--text-secondary)">&times;</button>
            </div>
            <form id="addForm" class="grid grid-cols-2 gap-3">
                <input type="hidden" id="editId" value="">
                <input type="text" id="fProject" required placeholder="Project name" class="border rounded-lg p-2.5 text-sm col-span-2" style="border-color:var(--border)">
                <input type="text" id="fRef" required placeholder="Reference no." class="border rounded-lg p-2.5 text-sm col-span-1 mono" style="border-color:var(--border)">
                <input type="text" id="fRecipient" required placeholder="Sender / recipient" class="border rounded-lg p-2.5 text-sm col-span-1" style="border-color:var(--border)">
                <input type="text" id="fSubject" required placeholder="Subject" class="border rounded-lg p-2.5 text-sm col-span-2" style="border-color:var(--border)">

                <select id="fType" class="border rounded-lg p-2.5 text-sm col-span-1" style="border-color:var(--border)">
                    <option value="Letter">Letter</option>
                    <option value="Material">Material</option>
                    <option value="Drawing">Drawing</option>
                    <option value="RFI">RFI</option>
                    <option value="Payment Certificate">Payment Certificate</option>
                    <option value="Final Handover">Final Handover</option>
                    <option value="Preliminary Handover">Preliminary Handover</option>
                </select>
                <select id="fDirection" class="border rounded-lg p-2.5 text-sm col-span-1" style="border-color:var(--border)">
                    <option value="Outgoing">Outgoing</option>
                    <option value="Incoming">Incoming</option>
                </select>

                <select id="fPriority" class="border rounded-lg p-2.5 text-sm col-span-1" style="border-color:var(--border)">
                    <option value="Normal">Normal</option>
                    <option value="Urgent">Urgent</option>
                </select>
                <input type="date" id="fDate" required class="border rounded-lg p-2.5 text-sm col-span-1" style="border-color:var(--border)">

                <div class="col-span-2">
                    <label class="text-xs mb-1 block" style="color:var(--text-secondary)">Attachment (PDF or image) — optional</label>
                    <input type="file" id="fAttachment" accept=".pdf,.jpg,.jpeg,.png" class="border rounded-lg p-2 text-sm w-full" style="border-color:var(--border)">
                </div>

                <div class="col-span-2 flex gap-2 mt-2">
                    <button id="submitBtn" class="btn-primary flex-1 rounded-lg p-2.5 text-sm font-medium">Save</button>
                    <button type="button" id="cancelEditBtn" class="rounded-lg p-2.5 text-sm font-medium px-5 border" style="border-color:var(--border)">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const db = supabase.createClient(
            'https://rzhyuufqhuejamcpbzst.supabase.co',
            'sb_publishable_sUFjo5uXyaL0MJbRrDIiFg_ixhooI4p'
        );

        let signUpMode = false;
        let allRows = [];
        let activeFilter = 'all';
        let searchText = '';
        let myRole = null, myCompanyId = null, myUserId = null;
        let companyMembers = [];

        // بيقبل القيم القديمة (عربي) أو الجديدة (إنجليزي) للدور، عشان الحسابات اللي اتعملت قبل التحديث تفضل شغالة
        const isManager = (role) => role === 'Manager' || role === 'مدير';
        const isEmployee = (role) => role === 'Employee' || role === 'موظف';

        const loginBox = document.getElementById('loginBox');
        const appBox = document.getElementById('appBox');
        const userBar = document.getElementById('userBar');
        const fullNameInput = document.getElementById('fullName');
        const roleSelect = document.getElementById('roleSelect');
        const addModal = document.getElementById('addModal');

        document.getElementById('fDate').value = new Date().toISOString().split('T')[0];

        function setAuthMode(signup) {
            signUpMode = signup;
            document.getElementById('tabLogin').style.background = signup ? '' : '#fff';
            document.getElementById('tabLogin').style.color = signup ? 'var(--text-secondary)' : 'var(--brand)';
            document.getElementById('tabSignup').style.background = signup ? '#fff' : '';
            document.getElementById('tabSignup').style.color = signup ? 'var(--brand)' : 'var(--text-secondary)';
            document.getElementById('loginTitle').textContent = signup ? 'Create your account' : 'Welcome back';
            document.getElementById('loginSubtitle').textContent = signup ? 'Enter a new or existing company code to get started' : 'Log in with your existing account';
            document.getElementById('loginSubmitBtn').textContent = signup ? 'Create account' : 'Log in';
            fullNameInput.classList.toggle('hidden', !signup);
            roleSelect.classList.toggle('hidden', !signup);
            // كود الشركة مطلوب بس وقت إنشاء حساب جديد، مش وقت تسجيل الدخول العادي
            const companyCodeInput = document.getElementById('companyCode');
            companyCodeInput.classList.toggle('hidden', !signup);
            companyCodeInput.required = signup;
        }
        document.getElementById('tabLogin').onclick = () => setAuthMode(false);
        document.getElementById('tabSignup').onclick = () => setAuthMode(true);
        setAuthMode(false); // الوضع الافتراضي عند فتح الصفحة: تسجيل دخول عادي

        // ============ Sign up / Log in ============
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;
            const companyCode = document.getElementById('companyCode').value.trim();

            if (signUpMode) {
                const chosenRole = roleSelect.value;
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) { alert('Error: ' + error.message); return; }

                let { data: existingCompany } = await db.from('companies').select('*').eq('code', companyCode).maybeSingle();
                let companyId;
                if (existingCompany) {
                    companyId = existingCompany.id;
                } else {
                    const { data: newCompany, error: cErr } = await db.from('companies').insert([{ code: companyCode }]).select().single();
                    if (cErr) { alert('Error creating company: ' + cErr.message); return; }
                    companyId = newCompany.id;
                }

                const { error: pErr } = await db.from('profiles').insert([{
                    id: data.user.id, company_id: companyId, full_name: document.getElementById('fullName').value, role: chosenRole
                }]);
                if (pErr) { alert('Error creating profile: ' + pErr.message); return; }

                alert(`Account created as ${chosenRole}! Please log in now.`);
                setAuthMode(false);
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert('Error: ' + error.message);
            }
        };

        document.getElementById('logoutBtn').onclick = () => db.auth.signOut();

        // ============ Quick login (testing only — fixed demo accounts, auto-created on first use) ============
        async function quickLogin(role) {
            const email = role === 'Manager' ? 'demo.manager@test.local' : 'demo.employee@test.local';
            const password = 'demo12345';
            const companyCode = 'DEMOCO';
            const fullName = role === 'Manager' ? 'Demo Manager' : 'Demo Employee';

            // نجرب دخول مباشر الأول (يعني الحساب موجود بالفعل من مرة قبل كده)
            let { error: loginErr } = await db.auth.signInWithPassword({ email, password });
            if (!loginErr) return; // نجح الدخول، خلاص

            // لو فشل الدخول، غالبًا الحساب لسه مش موجود - ننشئه تلقائيًا
            const { data, error: signUpErr } = await db.auth.signUp({ email, password });
            if (signUpErr) { alert('Quick login error: ' + signUpErr.message); return; }

            let { data: existingCompany } = await db.from('companies').select('*').eq('code', companyCode).maybeSingle();
            let companyId;
            if (existingCompany) {
                companyId = existingCompany.id;
            } else {
                const { data: newCompany, error: cErr } = await db.from('companies').insert([{ code: companyCode }]).select().single();
                if (cErr) { alert('Error creating demo company: ' + cErr.message); return; }
                companyId = newCompany.id;
            }

            const { error: pErr } = await db.from('profiles').insert([{ id: data.user.id, company_id: companyId, full_name: fullName, role }]);
            if (pErr) { alert('Error creating demo profile: ' + pErr.message); return; }

            // بعض إعدادات Supabase تطلب تأكيد إيميل قبل السماح بالدخول مباشرة بعد signUp
            const { error: reLoginErr } = await db.auth.signInWithPassword({ email, password });
            if (reLoginErr) alert('Account created. If email confirmation is required in your Supabase settings, disable it (Authentication > Providers > Email > "Confirm email") to allow instant quick login.');
        }
        document.getElementById('quickManagerBtn').onclick = () => quickLogin('Manager');
        document.getElementById('quickEmployeeBtn').onclick = () => quickLogin('Employee');

        // ============ Modal controls ============
        document.getElementById('openAddModal').onclick = () => { resetForm(); addModal.classList.remove('hidden'); };
        document.getElementById('closeModalBtn').onclick = () => addModal.classList.add('hidden');
        document.getElementById('cancelEditBtn').onclick = () => addModal.classList.add('hidden');

        // ============ Auth state ============
        db.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                myUserId = session.user.id;
                const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
                if (!profile) return;
                myRole = profile.role;
                myCompanyId = profile.company_id;

                const { data: members } = await db.from('profiles').select('id, full_name, role').eq('company_id', myCompanyId);
                companyMembers = members || [];

                loginBox.classList.add('hidden');
                appBox.classList.remove('hidden');
                userBar.classList.remove('hidden');
                userBar.classList.add('flex');
                document.getElementById('userRoleBadge').textContent = isManager(myRole) ? 'Manager' : 'Employee';
                document.getElementById('userNameBadge').textContent = profile.full_name || '';
                loadTable();
            } else {
                myRole = null; myCompanyId = null; myUserId = null;
                loginBox.classList.remove('hidden');
                appBox.classList.add('hidden');
                userBar.classList.add('hidden');
                userBar.classList.remove('flex');
            }
        });

        // ============ Filters & search ============
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeFilter = btn.dataset.filter;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderTable();
            });
        });
        function onSearch(e) {
            searchText = e.target.value.trim().toLowerCase();
            document.getElementById('searchInput').value = e.target.value;
            document.getElementById('searchInputMobile').value = e.target.value;
            renderTable();
        }
        document.getElementById('searchInput').addEventListener('input', onSearch);
        document.getElementById('searchInputMobile').addEventListener('input', onSearch);

        function statusStyle(status) {
            switch (status) {
                case 'Approved': return 'background:#ECFDF3;color:#067647';
                case 'Rejected': return 'background:#FEF3F2;color:#B42318';
                case 'In Progress': return 'background:#FFFAEB;color:#B54708';
                case 'Pending Manager Review': return 'background:#F4F3FF;color:#6938EF';
                default: return 'background:#F1F5F9;color:#475569';
            }
        }

        function memberName(id) {
            const m = companyMembers.find(x => x.id === id);
            return m ? (m.full_name || m.role) : '—';
        }

        // ============ Load data ============
        async function loadTable() {
            const { data, error } = await db.from('correspondence').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tableBody');
            if (error) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-red-600">${error.message}</td></tr>`;
                return;
            }
            allRows = data || [];
            renderStats();
            renderTable();
        }

        function renderStats() {
            const counts = { 'New': 0, 'In Progress': 0, 'Pending Manager Review': 0, 'Approved': 0, 'Rejected': 0 };
            allRows.forEach(r => { const s = r.status || 'New'; if (counts[s] !== undefined) counts[s]++; });
            const labels = { 'New': 'New', 'In Progress': 'In Progress', 'Pending Manager Review': 'Pending Review', 'Approved': 'Approved', 'Rejected': 'Rejected' };
            document.getElementById('statsRow').innerHTML = Object.keys(counts).map(k => `
                <div class="card p-4">
                    <div class="text-2xl font-semibold">${counts[k]}</div>
                    <div class="text-xs mt-0.5" style="color:var(--text-secondary)">${labels[k]}</div>
                </div>
            `).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            let rows = activeFilter === 'all' ? allRows : allRows.filter(r => (r.status || 'New') === activeFilter);

            if (searchText) {
                rows = rows.filter(r =>
                    (r.reference_no || '').toLowerCase().includes(searchText) ||
                    (r.subject || '').toLowerCase().includes(searchText) ||
                    (r.project_name || '').toLowerCase().includes(searchText)
                );
            }

            const needsAction = allRows.filter(r => r.assigned_to === myUserId && r.status === 'In Progress');
            const alertBox = document.getElementById('actionAlert');
            if (isEmployee(myRole) && needsAction.length > 0) {
                alertBox.classList.remove('hidden');
                document.getElementById('actionCount').textContent = needsAction.length;
            } else {
                alertBox.classList.add('hidden');
            }

            if (!rows.length) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center" style="color:var(--text-secondary)">No matching documents.</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map(row => {
                const flagged = (row.assigned_to === myUserId && row.status === 'In Progress') ? 'row-flag' : '';
                const attachmentCell = row.attachment_url
                    ? `<a href="${row.attachment_url}" target="_blank" class="text-xs font-medium" style="color:var(--brand-light)">View file</a>`
                    : '<span style="color:var(--text-secondary)">—</span>';
                return `
                <tr class="border-b ${flagged}" style="border-color:var(--border)">
                    <td class="p-3">${row.project_name || '—'}</td>
                    <td class="p-3 mono text-xs">${row.reference_no || '—'}</td>
                    <td class="p-3">
                        ${row.subject || '—'}
                        ${row.reply_text ? `<div class="text-xs mt-1" style="color:var(--text-secondary)">💬 ${row.reply_text}</div>` : ''}
                        ${row.reply_attachment_url ? `<a href="${row.reply_attachment_url}" target="_blank" class="text-xs font-medium block mt-0.5" style="color:var(--brand-light)">Reply attachment</a>` : ''}
                    </td>
                    <td class="p-3">${row.type || '—'}</td>
                    <td class="p-3">${attachmentCell}</td>
                    <td class="p-3">${memberName(row.assigned_to)}</td>
                    <td class="p-3"><span class="status-pill" style="${statusStyle(row.status)}">${row.status || 'New'}</span></td>
                    <td class="p-3 whitespace-nowrap">${actionCell(row)}</td>
                </tr>
            `}).join('');
        }

        function actionCell(row) {
            const status = row.status || 'New';

            if (isManager(myRole)) {
                if (status === 'New') {
                    const employees = companyMembers.filter(m => isEmployee(m.role));
                    const options = employees.map(e => `<option value="${e.id}">${e.full_name || 'Employee'}</option>`).join('');
                    return `
                        <div class="flex flex-col gap-1 min-w-[140px]">
                            <select id="assign-${row.id}" class="border rounded text-xs p-1" style="border-color:var(--border)">${options || '<option value="">No employees</option>'}</select>
                            <button onclick="assignToEmployee('${row.id}')" class="text-white text-xs px-2 py-1 rounded" style="background:var(--brand-light)">Transfer</button>
                        </div>
                    `;
                }
                if (status === 'Pending Manager Review') {
                    return `
                        <div class="flex gap-1 flex-wrap">
                            <button onclick="changeStatus('${row.id}', 'Approved')" class="text-white text-xs px-2 py-1 rounded" style="background:#12B76A">Approve</button>
                            <button onclick="changeStatus('${row.id}', 'Rejected')" class="text-white text-xs px-2 py-1 rounded" style="background:#F04438">Reject</button>
                        </div>
                    `;
                }
                return `<button onclick="deleteRow('${row.id}')" class="text-xs px-2 py-1 rounded border" style="border-color:var(--border);color:var(--text-secondary)">Delete</button>`;
            }

            if (isEmployee(myRole) && row.assigned_to === myUserId && status === 'In Progress') {
                return `
                    <div class="flex flex-col gap-1 min-w-[160px]">
                        <textarea id="reply-${row.id}" rows="2" placeholder="Write your reply..." class="border rounded text-xs p-1" style="border-color:var(--border)"></textarea>
                        <input type="file" id="replyFile-${row.id}" accept=".pdf,.jpg,.jpeg,.png" class="text-xs">
                        <button onclick="sendReply('${row.id}')" class="text-white text-xs px-2 py-1 rounded" style="background:var(--brand-light)">Reply & forward</button>
                    </div>
                `;
            }

            return `<span class="text-xs" style="color:var(--text-secondary)">—</span>`;
        }

        // ============ Storage upload ============
        async function uploadFile(file, subfolder) {
            if (!file) return null;
            const path = `${myCompanyId}/${subfolder}/${Date.now()}_${file.name}`;
            const { error } = await db.storage.from('attachments').upload(path, file);
            if (error) { alert('Upload error: ' + error.message); return null; }
            const { data } = db.storage.from('attachments').getPublicUrl(path);
            return data.publicUrl;
        }

        async function assignToEmployee(id) {
            const select = document.getElementById('assign-' + id);
            const employeeId = select.value;
            if (!employeeId) { alert('Select an employee first'); return; }
            const { error } = await db.from('correspondence').update({ assigned_to: employeeId, status: 'In Progress' }).eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadTable();
        }

        async function sendReply(id) {
            const textarea = document.getElementById('reply-' + id);
            const fileInput = document.getElementById('replyFile-' + id);
            const replyText = textarea.value.trim();
            if (!replyText) { alert('Please write a reply first'); return; }

            let replyAttachmentUrl = null;
            if (fileInput.files[0]) replyAttachmentUrl = await uploadFile(fileInput.files[0], 'replies');

            const { error } = await db.from('correspondence').update({
                reply_text: replyText, reply_attachment_url: replyAttachmentUrl, status: 'Pending Manager Review'
            }).eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadTable();
        }

        async function changeStatus(id, newStatus) {
            if (!confirm('Are you sure?')) return;
            const { error } = await db.from('correspondence').update({ status: newStatus }).eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadTable();
        }

        async function deleteRow(id) {
            if (!confirm('Permanently delete this document?')) return;
            const { error } = await db.from('correspondence').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadTable();
        }

        function resetForm() {
            document.getElementById('addForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('formTitle').textContent = 'New Document';
            document.getElementById('submitBtn').textContent = 'Save';
        }

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fAttachment');
            let attachmentUrl = null;
            if (fileInput.files[0]) attachmentUrl = await uploadFile(fileInput.files[0], 'documents');

            const rowData = {
                project_name: document.getElementById('fProject').value,
                reference_no: document.getElementById('fRef').value,
                sender_recipient: document.getElementById('fRecipient').value,
                subject: document.getElementById('fSubject').value,
                type: document.getElementById('fType').value,
                direction: document.getElementById('fDirection').value,
                priority: document.getElementById('fPriority').value,
                correspondence_date: document.getElementById('fDate').value,
                attachment_url: attachmentUrl,
                status: 'New',
                company_id: myCompanyId,
                user_id: myUserId
            };

            const { error } = await db.from('correspondence').insert([rowData]);
            if (error) {
                alert('Error: ' + error.message);
            } else {
                resetForm();
                addModal.classList.add('hidden');
                loadTable();
            }
        };
    </script>
</body>
</html>
